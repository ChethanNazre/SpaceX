name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2  # This is crucial!
          persist-credentials: true

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          username: 'ChethanNazre'
          strategy: 'random'
          fps: '40'

      - name: Commit and push generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ensure file exists before trying to add
          if [ -f game.gif ]; then
            git add game.gif
            git commit -m "Update generated game.gif [skip ci]" || echo "No changes to commit"
            git push
          else
            echo "game.gif not found"
          fi
